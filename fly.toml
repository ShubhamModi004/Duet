# fly.toml app configuration file generated for duet-signal-shubham on 2026-10-30T10:06:34+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'duet-signal-shubham'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.signal'

[env]
  DUET_ADDR = '0.0.0.0:8787'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
